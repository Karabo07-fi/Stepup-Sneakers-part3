<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Now</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>STEPUP SNEAKERS</h1>
        <nav>
            <a href="Homepage.HTML">Home</a>
            <a href="about.HTML">About</a>
            <a href="products.HTML">Shop</a>
            <a href="enquiry.HTML">Enquiry</a>
            <a href="contact.HTML">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Our Collection</h2>
            
            <div class="product-grid">
                <div class="product">
                    <img src="pictures/Nike Shox.png" alt="Nike Shox">
                    <h3>Nike Shox</h3>
                    <p>R2,499.00</p>
                    <p>Sizes: 3 - 11</p>
                </div>

                <div class="product">
                    <img src="pictures/Air jordan 4.webp" alt="Air Jordan 4">
                    <h3>Air Jordan 4</h3>
                    <p>R3,299.00</p>
                    <p>Sizes: 3 - 10</p>
                </div>
            </div>

            <h3>Categories</h3>
            <ul>
                <li>Men's Sneakers</li>
                <li>Women's Sneakers</li>
                <li>Kids</li>
                <li>Accessories</li>
            </ul>
        </section>
    </main>

    <input type="text" id="searchSneakers" placeholder="Search sneakers... e.g. Nike">
<div id="product-list" style="display:flex; flex-wrap:wrap; gap:15px;"></div>
<div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:1000;">
<img id="lightboxImg" src="" style="max-width:90%; max-height:90%;">
</div>

    <footer>
        <p>&copy; 2026 StepUp Sneakers. All rights reserved.</p>
    </footer>
